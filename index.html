<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HabiTools | Premium Utility Suite</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #08090d; }
    .bg-mesh {
      background: radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.18) 0px, transparent 50%),
                  radial-gradient(at 100% 0%, rgba(6, 182, 212, 0.15) 0px, transparent 50%),
                  radial-gradient(at 50% 50%, rgba(139, 92, 246, 0.08) 0px, transparent 60%);
    }
    .tool-card {
      background: linear-gradient(180deg, rgba(23, 25, 35, 0.75) 0%, rgba(14, 15, 23, 0.85) 100%);
      border: 1px solid rgba(255, 255, 255, 0.06);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .tool-card:hover {
      border-color: rgba(99, 102, 241, 0.5);
      transform: translateY(-4px);
      box-shadow: 0 12px 30px -10px rgba(99, 102, 241, 0.25);
    }
    .hero-glow {
      text-shadow: 0 0 40px rgba(129, 140, 248, 0.4);
    }
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: #08090d; }
    ::-webkit-scrollbar-thumb { background: #262938; border-radius: 4px; }
  </style>
</head>
<body class="text-slate-100 min-h-screen flex flex-col bg-mesh antialiased">

  <!-- Navbar -->
  <header class="sticky top-0 z-40 border-b border-white/[0.06] bg-[#08090d]/80 backdrop-blur-xl">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 py-3.5 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-indigo-500 via-purple-500 to-pink-500 flex items-center justify-center font-black text-white shadow-lg shadow-indigo-500/30">
          <i class="fa-solid fa-wand-magic-sparkles text-sm"></i>
        </div>
        <div>
          <h1 class="text-lg font-black tracking-tight text-white flex items-center gap-1.5">
            Habi<span class="text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 via-purple-300 to-pink-400">Tools</span>
            <span class="text-[9px] px-2 py-0.5 rounded-full bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 font-bold uppercase tracking-wider">Suite</span>
          </h1>
          <p class="text-[10px] text-slate-400 font-medium">Fast, Private & 100% Free</p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <div class="flex items-center gap-2 px-3 py-1 rounded-full bg-white/[0.04] border border-white/[0.08] text-xs text-slate-300">
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
          <span id="toolCount">0</span> Tools Online
        </div>
      </div>
    </div>
  </header>

  <!-- Hero Header -->
  <section class="max-w-4xl mx-auto px-4 pt-12 pb-6 text-center">
    <div class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-indigo-500/10 border border-indigo-500/20 text-xs font-semibold text-indigo-300 mb-5">
      <i class="fa-solid fa-bolt text-amber-400"></i> Next-Gen Productivity Engine
    </div>
    
    <h2 class="text-3xl sm:text-5xl md:text-6xl font-extrabold text-white tracking-tight mb-4 hero-glow">
      Ultimate Toolkit for <br class="hidden sm:inline"/>
      <span class="text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 via-purple-300 to-cyan-400">Everything You Need</span>
    </h2>
    <p class="text-slate-400 text-sm sm:text-base max-w-xl mx-auto mb-8 font-normal">
      High precision financial calculators, formatters, and smart utilities built directly into your browser.
    </p>

    <!-- Search Box -->
    <div class="relative max-w-xl mx-auto mb-6">
      <i class="fa-solid fa-magnifying-glass absolute left-4 top-4 text-slate-500"></i>
      <input type="text" id="toolSearch" onkeyup="filterTools()" placeholder="Search any tool (EMI, GST, Age, QR, Password, UUID)..." 
        class="w-full pl-11 pr-4 py-3.5 bg-[#12141d] border border-white/10 focus:border-indigo-500 rounded-2xl text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-4 focus:ring-indigo-500/15 transition shadow-2xl text-sm">
    </div>

    <!-- Category Filter Tabs -->
    <div class="flex flex-wrap gap-2 justify-center text-xs" id="catFilter">
      <button onclick="filterCat('all', event)" class="px-4 py-2 rounded-xl bg-gradient-to-r from-indigo-600 to-purple-600 text-white font-semibold cat-btn shadow-lg shadow-indigo-600/25 transition">All Tools</button>
      <button onclick="filterCat('Finance & Tax', event)" class="px-4 py-2 rounded-xl bg-[#141622] hover:bg-[#1c1f30] border border-white/[0.06] text-slate-300 cat-btn transition">Finance & Tax</button>
      <button onclick="filterCat('Calculators', event)" class="px-4 py-2 rounded-xl bg-[#141622] hover:bg-[#1c1f30] border border-white/[0.06] text-slate-300 cat-btn transition">Calculators</button>
      <button onclick="filterCat('Text & Media', event)" class="px-4 py-2 rounded-xl bg-[#141622] hover:bg-[#1c1f30] border border-white/[0.06] text-slate-300 cat-btn transition">Text & Media</button>
      <button onclick="filterCat('Developer', event)" class="px-4 py-2 rounded-xl bg-[#141622] hover:bg-[#1c1f30] border border-white/[0.06] text-slate-300 cat-btn transition">Developer</button>
    </div>
  </section>

  <!-- Tools Grid -->
  <main class="max-w-7xl mx-auto px-4 pb-24 flex-grow w-full">
    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4" id="toolsGrid"></div>
  </main>

  <!-- Interactive Modal Engine -->
  <div id="toolModal" class="fixed inset-0 bg-black/85 backdrop-blur-md z-50 hidden flex items-center justify-center p-4 overflow-y-auto">
    <div class="bg-[#11131c] border border-white/10 w-full max-w-lg rounded-3xl p-6 sm:p-7 shadow-2xl relative my-8">
      <div class="flex items-center justify-between border-b border-white/[0.08] pb-4 mb-5">
        <div class="flex items-center space-x-3">
          <div id="modalIconBox" class="w-11 h-11 rounded-2xl flex items-center justify-center text-lg"></div>
          <div>
            <h3 id="modalTitle" class="font-bold text-lg text-white">Tool</h3>
            <p id="modalCat" class="text-[11px] text-slate-400 font-medium"></p>
          </div>
        </div>
        <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-white/[0.06] hover:bg-white/[0.12] text-slate-300 flex items-center justify-center transition text-lg">&times;</button>
      </div>
      <div id="modalBody" class="space-y-4 text-sm"></div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="border-t border-white/[0.05] bg-[#06070a] py-6 text-center text-xs text-slate-500">
    <p>© 2026 <span class="font-bold text-slate-400">HabiTools</span>. Crafted with Speed & Precision.</p>
  </footer>

  <script src="js/tools-data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
